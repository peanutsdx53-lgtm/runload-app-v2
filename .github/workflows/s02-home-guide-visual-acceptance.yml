name: S02 Home screen guide visual acceptance
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'ui/homeExperience.css'
      - 'index.html'
      - 'sw.js'
      - 'tests/s02HomeGuideBrowser.mjs'
      - 'tests/s02HomeScreenGuide.test.mjs'
      - '.github/workflows/s02-home-guide-visual-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-home-guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browsers
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Check screen-guide contracts
        run: node --test tests/s02HomeScreenGuide.test.mjs tests/homeExperience.test.mjs tests/homeDashboardLayout.test.mjs tests/s02HomePreviewRemoval.test.mjs
      - name: Capture S02 guide
        env:
          RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node tests/s02HomeGuideBrowser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s02-home-guide-${{ matrix.engine }}
          path: audit-output/s02-home-guide/
          if-no-files-found: warn
          retention-days: 14
