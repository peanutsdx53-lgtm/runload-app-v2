name: Research interpretation source snapshot
on:
  push:
    branches:
      - research/interpretation-ux-20261028
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: research-interpretation-full-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 7
