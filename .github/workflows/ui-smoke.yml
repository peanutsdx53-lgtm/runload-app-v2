name: UI Next smoke
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check pwa.js
          node --check sw.js
          node --check assets/bodyRegionVisuals.js
          node --check ui/homeDashboardLayout.js
          node --check ui/homeExperience.js
          node --check ui/rofJScale.js
          node --check ui/rofExperience.js
          node --check ui/recordDraftReview.js
          node --check ui/recordExperience.js
          node --check ui/recordReviewExperience.js
          node --check ui/manualRunStore.js
          node --check ui/resultExperience.js
          node --check ui/resultInlineStyles.js
          node --check ui/gaitExperience.js
          node --check ui/environmentExperience.js
          node --check ui/measurementExperience.js
          node --check core/activity/activityReference.js
          node --check core/activity/running.js
          node --check core/activity/jogging.js
          node --check core/activity/walking.js
          node --check core/runningEvidence/runningEvidenceEngine.js
          node --check core/internal/mobileWalkJogSpeedModel.js
          node --check ui/gpsLiveMap.js
          node --check ui/gpsStorageHealth.js
          node --check ui/gpsCourseEvidence.js
          node --check ui/explorationExperience.js
          node --check ui/explorationReadAdapter.js
      - name: UI and installability contracts
        run: node --test tests/uiContracts.test.mjs tests/homeDashboardLayout.test.mjs tests/homeExperience.test.mjs tests/rofJScale.test.mjs tests/rofExperience.test.mjs tests/recordDraftReview.test.mjs tests/recordExperience.test.mjs tests/recordReviewExperience.test.mjs tests/resultExperience.test.mjs tests/manualRunStore.test.mjs tests/scienceEngineParity.test.mjs tests/gaitExperience.test.mjs tests/environmentExperience.test.mjs tests/measurementExperience.test.mjs tests/gpsIndexedDbStore.test.mjs tests/gpsAltitudeQuality.test.mjs tests/gpsLongTrack.test.mjs tests/gpsDesignAssurance.test.mjs tests/gpsSoftwareCloseout.test.mjs tests/gpsBackupContract.test.mjs tests/gpsStorageHealth.test.mjs tests/gpsCourseEvidence.test.mjs tests/gpsLiveMap.test.mjs tests/explorationExperience.test.mjs tests/explorationLearning.test.mjs tests/mobileInputFocus.test.mjs tests/historyInputFocus.test.mjs tests/historyExperience.test.mjs
