name: Record optional screen density audit
on:
  push:
    branches: [main]
    paths:
      - 'tests/recordOptionalDensityAuditBrowser.mjs'
      - 'ui/bodyContextExperience.js'
      - 'ui/bodyContextExperience.css'
      - 'app.js'
      - 'tests/bodyContextExperience.test.mjs'
      - 'tests/recordExperience.test.mjs'
      - 'ui/recordExperience.js'
      - 'ui/recordExperience.css'
      - '.github/workflows/record-optional-density-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium,webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Body regression tests
        run: node --test tests/bodyContextExperience.test.mjs tests/recordExperience.test.mjs
      - name: Capture empty and dense populated screens
        env:
          RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node tests/recordOptionalDensityAuditBrowser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-optional-density-${{ matrix.engine }}
          path: audit-output/record-optional-density
          if-no-files-found: warn
          retention-days: 14
