name: UIUX05 S15 S16 S17 targeted visual acceptance
on:
  push:
    branches: [main]
    paths:
      - 'tests/uiux05TargetBrowser.mjs'
      - '.github/workflows/uiux05-targeted-visual.yml'
      - 'ui/consultationExperience.js'
      - 'ui/dataManagementUi.js'
      - 'ui/measurementExperience.js'
      - 'app.js'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-screen-states:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check tests/uiux05TargetBrowser.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Check sharing, deletion safeguards and GPS availability at 320 390 1440
        env:
          RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node tests/uiux05TargetBrowser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uiux05-real-screens-${{ matrix.engine }}
          path: audit-output/uiux05-${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 14
