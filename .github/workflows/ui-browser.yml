name: UI browser visual smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'sw.js'
      - 'ui/**'
      - 'tests/browserSmoke.mjs'
      - 'tests/explorationWebkitSmoke.mjs'
      - '.github/workflows/ui-browser.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'pwa.js'
      - 'sw.js'
      - 'assets/**'
      - 'ui/**'
      - 'tests/browserSmoke.mjs'
      - 'tests/livePagesSmoke.mjs'
      - 'tests/explorationWebkitSmoke.mjs'
      - 'ui/resultExperience.js'
      - 'ui/resultExperience.css'
      - '.github/workflows/ui-browser.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    # Pin supported runner: Ubuntu 26.04 mirror can stall the Japanese-font install.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Upload checked-out UI for local visual QA
        uses: actions/upload-artifact@v4
        with:
          name: runload-ui-snapshot
          path: |
            app.js
            styles.css
            index.html
            pwa.js
            sw.js
            manifest.webmanifest
            icons/
            assets/
            ui/
            tests/
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright@1.56.1
          BROWSER_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$BROWSER_PATH" ]; then
            echo "RUNLOAD_CHROME=$BROWSER_PATH" >> "$GITHUB_ENV"
            echo "Browser binary: $BROWSER_PATH"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Install optional Japanese glyphs for Chromium screenshots
        # Functional Chromium checks must not be blocked by intermittent apt
        # mirrors; WebKit visual QA remains responsible for CJK font rendering.
        run: |
          if fc-list :lang=ja | grep -Eqi 'Noto|IPA|Takao'; then
            echo "Japanese fonts already present"
          elif sudo timeout 65s apt-get install -y --no-install-recommends fonts-ipafont-gothic; then
            fc-cache -f
          else
            echo "::warning::CJK font mirror unavailable; Chromium functionality is still tested. WebKit is the Japanese visual gate."
          fi
          fc-list :lang=ja | grep -Eqi 'Noto|IPA|Takao' || echo "CJK appearance verified separately in WebKit"
          fc-match :lang=ja
      - name: GPS dynamic replay IndexedDB mobile and desktop
        run: node tests/gpsDynamicBrowserSmoke.mjs
      - name: Desktop and smartphone UI interactions
        run: node tests/browserSmoke.mjs
      - name: Verify the actual public Pages screen
        # Pull requests preview candidate code locally; the deployed site contains main, not PR changes.
        # Check the deployed URL only on main builds, not as a pre-merge gate.
        if: github.event_name == 'push'
        run: node tests/livePagesSmoke.mjs
      - name: Upload visual inspection screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runload-ui-next-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

  webkit-visual:
    # WebKit Playwright 1.56 does not support the Ubuntu 26.04 runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit browser and dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Ensure Japanese glyph support
        run: |
          if ! fc-list :lang=ja | grep -Eqi 'Noto|IPA|Takao'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-ipafont-gothic
            fc-cache -f
          fi
      - name: WebKit smartphone reading card and screenshot inspection
        run: node tests/explorationWebkitSmoke.mjs
      - name: WebKit GPS dynamic replay IndexedDB mobile and desktop
        env:
          RUNLOAD_BROWSER_ENGINE: webkit
        run: node tests/gpsDynamicBrowserSmoke.mjs
      - name: Upload WebKit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runload-exploration-webkit-screenshots
          path: screenshots/webkit-*.png
          if-no-files-found: ignore
          retention-days: 14
