name: UI browser visual smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'pwa.js'
      - 'sw.js'
      - 'assets/**'
      - 'ui/**'
      - 'tests/browserSmoke.mjs'
      - '.github/workflows/ui-browser.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Upload checked-out UI for local visual QA
        uses: actions/upload-artifact@v4
        with:
          name: runload-ui-snapshot
          path: |
            app.js
            styles.css
            index.html
            pwa.js
            sw.js
            manifest.webmanifest
            icons/
            assets/
            ui/
            tests/
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright@1.56.1
          BROWSER_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$BROWSER_PATH" ]; then
            echo "RUNLOAD_CHROME=$BROWSER_PATH" >> "$GITHUB_ENV"
            echo "Browser binary: $BROWSER_PATH"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Install Japanese glyphs for faithful UI screenshots
        run: |
          if fc-list :lang=ja | grep -qi 'Noto'; then
            echo "Japanese Noto fonts already present"
          else
            sudo timeout 150s apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi
          fc-match :lang=ja
      - name: Desktop and smartphone UI interactions
        run: node tests/browserSmoke.mjs
      - name: Upload visual inspection screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runload-ui-next-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
