name: S09 record review and manual icon visual acceptance
on:
  push:
    branches: [main]
    paths:
      - 'ui/recordReviewExperience.js'
      - 'ui/recordReviewExperience.css'
      - 'ui/recordExperience.js'
      - 'ui/recordExperience.css'
      - 'ui/recordIcons.js'
      - 'tests/recordReviewVisualBrowser.mjs'
      - 'tests/recordReviewExperience.test.mjs'
      - '.github/workflows/s09-review-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium,webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Unit test review and manual routes
        run: node --test tests/recordReviewExperience.test.mjs tests/recordExperience.test.mjs
      - name: Capture PC and smartphone review states
        env:
          RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node tests/recordReviewVisualBrowser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s09-review-${{ matrix.engine }}
          path: audit-output/review-density/
          if-no-files-found: warn
          retention-days: 14
