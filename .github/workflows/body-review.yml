name: Body review source and visual
on:
  push:
    branches:
      - design/body-equipment-v8-review
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and preservation checks
        run: |
          node --check app.js
          node --check ui/bodyContextExperience.js
          node --check sw.js
          node --test tests/*.test.mjs
      - name: Install browser tool
        run: |
          npm install --no-save playwright@1.56.1
          BROWSER_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$BROWSER_PATH" ]; then
            echo "RUNLOAD_CHROME=$BROWSER_PATH" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Install Japanese glyphs for faithful UI screenshots
        run: |
          if ! fc-list :lang=ja | grep -qi 'Noto'; then
            sudo timeout 150s apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi
          fc-match :lang=ja
      - name: Desktop and smartphone existing UI smoke
        run: node tests/browserSmoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: body-v8-review-browser-shots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Capture exact reviewed source
        run: tar -czf /tmp/runload-v2-source.tgz --exclude=.git .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: body-review-repository-source
          path: /tmp/runload-v2-source.tgz
          retention-days: 3
