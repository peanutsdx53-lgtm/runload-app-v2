name: UIUX04 S12 S13 S14 targeted visual acceptance
on:
  push:
    branches: [main]
    paths:
      - 'tests/uiux04TargetBrowser.mjs'
      - '.github/workflows/uiux04-targeted-visual.yml'
      - 'ui/explorationExperience.js'
      - 'ui/explorationExperience.css'
      - 'ui/conditionJourney.js'
      - 'ui/conditionJourney.css'
      - 'app.js'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-screen-states:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check tests/uiux04TargetBrowser.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run learning, note and life-condition acceptance
        env:
          RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node tests/uiux04TargetBrowser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uiux04-real-screens-${{ matrix.engine }}
          path: audit-output/uiux04-${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 14
